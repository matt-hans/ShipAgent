services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shipagent
      POSTGRES_USER: shipagent
      POSTGRES_PASSWORD: shipagent
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipagent"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6380:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
