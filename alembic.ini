[alembic]
script_location = alembic
sqlalchemy.url = sqlite+aiosqlite:///./shipagent_control_plane.db
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
class = logging.Formatter
format = %(levelname)-5.5s [%(name)s] %(message)s

[alembic:runtime]
shipagent_control_plane_schema = shipagent_private
